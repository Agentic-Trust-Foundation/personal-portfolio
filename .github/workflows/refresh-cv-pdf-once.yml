name: Refresh CV PDF once
on:
  push:
    branches: [fix/slower-terminal-devsecops-label]
    paths:
      - content/profile.json
      - .github/workflows/refresh-cv-pdf-once.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF text editor and original font
        run: |
          python -m pip install --disable-pip-version-check pymupdf==1.26.7
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-open-sans
      - name: Replace only the DevSecOps label while retaining the Novoresume layout
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import fitz
          old = "DevSecOps Training (2026; final session Nov 20)"
          new = "DevSecOps Training (2026)"
          profile = json.loads(Path("content/profile.json").read_text(encoding="utf-8"))
          assert new in profile["training"] and old not in profile["training"]
          html = Path("public/cv.html").read_text(encoding="utf-8")
          assert new in html and old not in html
          path = Path("public/resume.pdf")
          doc = fitz.open(path)
          assert len(doc) == 2
          matches = []
          for page in doc:
              rects = page.search_for(old)
              if rects: matches.append((page, rects))
          assert len(matches) == 1 and len(matches[0][1]) == 1, "Old label is not unique"
          page, rects = matches[0]
          match = next(
              s for b in page.get_text("dict")["blocks"] for line in b.get("lines",[])
              for s in line["spans"] if old in s["text"]
          )
          fontfile = "/usr/share/fonts/truetype/open-sans/OpenSans-Bold.ttf"
          assert Path(fontfile).exists()
          color = match["color"]
          rgb = tuple(((color >> shift) & 255) / 255 for shift in (16, 8, 0))
          page.add_redact_annot(rects[0], fill=(1,1,1))
          page.apply_redactions(images=0, graphics=0, text=0)
          page.insert_font(fontname="FullOpenSansBold", fontfile=fontfile)
          page.insert_text(match["origin"], new, fontsize=match["size"],
                           fontname="FullOpenSansBold", color=rgb, overlay=True)
          temp = path.with_suffix(".new.pdf")
          doc.save(temp, garbage=4, deflate=True)
          doc.close()
          os.replace(temp,path)
          verify = fitz.open(path)
          assert len(verify) == 2
          text = "\n".join(page.get_text() for page in verify)
          assert new in text and old not in text, "Updated label not searchable"
          assert "AgentWallet" in text and "Kuhban" in text
          print("CV_PDF_LABEL=PASS pages=2 bytes="+str(path.stat().st_size))
          PY
      - name: Commit the reviewed PDF on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add public/resume.pdf
          if git diff --cached --quiet; then
            echo "CV_ASSETS=ALREADY_CURRENT"
          else
            git commit -m "build(cv): replace DevSecOps PDF label with original font"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
